# Installed as a template; nginx:alpine substitutes environment variables at startup.
# Defaults are set in Dockerfile. For local Docker development, override
# GARDEN_SERVICE_HOST=<host's Docker bridge gateway IP> and
# GARDEN_SERVICE_PORT=8001 (Garden must listen on an accessible interface).
# Find that IP with: docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'
# Use a DNS-resolvable hostname or IP; runtime Nginx DNS bypasses /etc/hosts.
# Native Nginx: substitute these three placeholders into conf.d/default.conf,
# using your Garden host/port and DNS server(s) from /etc/resolv.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The official entrypoint reads the container's DNS servers from resolv.conf.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $garden_backend "${GARDEN_SERVICE_HOST}:${GARDEN_SERVICE_PORT}";

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        # A variable upstream permits runtime DNS re-resolution. No URI in
        # proxy_pass: forward the rewritten path and original query string.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$garden_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
