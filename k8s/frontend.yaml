apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: smart-garden
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: smart-garden
    spec:
      containers:
        - name: frontend
          image: kdkanishka/garden-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: GARDEN_SERVICE_HOST
              # Nginx's runtime resolver does not expand DNS search suffixes.
              value: garden-service-svc.default.svc.cluster.local
            - name: GARDEN_SERVICE_PORT
              value: "80"
            - name: AUTH_SERVICE_HOST
              value: auth-service-svc.default.svc.cluster.local
            - name: AUTH_SERVICE_PORT
              value: "80"
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    app: frontend
    app.kubernetes.io/part-of: smart-garden
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
