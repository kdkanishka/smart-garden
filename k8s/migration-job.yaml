# Apply after PostgreSQL is Ready; wait for completion before Garden rollout.
# For a new release, delete the completed Job and recreate with the new image tag.
apiVersion: batch/v1
kind: Job
metadata:
  name: garden-migrate
  labels:
    app: garden-migrate
    app.kubernetes.io/part-of: smart-garden
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: garden-migrate
        app.kubernetes.io/part-of: smart-garden
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: kdkanishka/garden-service:v2
          imagePullPolicy: IfNotPresent
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garden-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
