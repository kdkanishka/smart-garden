apiVersion: apps/v1
kind: Deployment
metadata:
  name: garden-service
  labels:
    app: garden-service
    app.kubernetes.io/part-of: smart-garden
spec:
  replicas: 2
  selector:
    matchLabels:
      app: garden-service
  template:
    metadata:
      labels:
        app: garden-service
        app.kubernetes.io/part-of: smart-garden
    spec:
      containers:
        - name: garden-service
          image: kdkanishka/garden-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: garden-config
          env:
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: garden-auth-keys
                  key: public.pem
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garden-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: garden-service-svc
  labels:
    app: garden-service
    app.kubernetes.io/part-of: smart-garden
spec:
  type: ClusterIP
  selector:
    app: garden-service
  ports:
    - name: http
      port: 80
      targetPort: http
